# The whole toolchain at pinned versions: `mise install` sets up a laptop, and CI and the dev container use the same file.
[tools]
node = "24.22.1"
pnpm = "12.8.1"
kubectl = "1.37.1"
k3d = "5.9.0"
helm = "4.3.0"
kustomize = "5.8.2"
# What the deploy pull requests' checks verify images with (check.yml), and `make admission-ready` too.
cosign = "3.1.3"
# The kubectl plugin for watching and promoting the website's canary (`kubectl argo rollouts`), at the version of the
# controller in deploy/base/rollouts.
argo-rollouts = "1.10.0"
# The local certificate authority `make up` makes for https://console.localhost:8443, constrained to `localhost` names
# (mkcert cannot constrain one), and the tests that hold it to them.
step = "0.31.0"
