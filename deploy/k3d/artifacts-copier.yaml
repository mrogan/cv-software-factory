# A pod that mounts the artifacts volume for a moment, so `make samples` can copy the samples' screenshots into
# it and `make real-store` can empty it. Applied and deleted by those targets, never by Argo CD. It runs the Postgres image the cluster already has,
# for its shell and tar, as the console's user, so the console can read what it copies. The targets name the image, from
# the cluster's StatefulSet, in place of `postgres`.
apiVersion: v1
kind: Pod
metadata:
  name: artifacts-copier
  namespace: factory
  labels:
    app.kubernetes.io/name: artifacts-copier
    app.kubernetes.io/part-of: software-factory
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: copier
      image: postgres
      command: [sleep, "300"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: artifacts
          mountPath: /var/lib/factory/artifacts
  volumes:
    - name: artifacts
      persistentVolumeClaim:
        claimName: artifacts
