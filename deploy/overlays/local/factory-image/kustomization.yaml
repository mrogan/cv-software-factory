# The factory images CI built last, pinned by digest, and with them the workers that run them (deploy/base/factory) and
# the canary's analysis, whose journeys run on `factory-browser` (deploy/base/analysis), so the cluster never has either
# without an image to run. The factory's GitHub worker moves the three digests together, in a pull request, when CI has
# built all three from a newer commit.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- ../../../base/factory
- ../../../base/runners
- ../../../base/analysis
images:
- digest: sha256:835948dd96b89af86ebaa887177fca459f0d2e566069886ba697a20ad87ead63
  name: factory
  newName: ghcr.io/mrogan/cv-software-factory/factory
- digest: sha256:92e361d5acc472f26afd99d4b55fd78586284cdfc1e6cbeb1253db420838f2f9
  name: factory-browser
  newName: ghcr.io/mrogan/cv-software-factory/factory-browser
- digest: sha256:cd094cbdb12000e570504d63baa68ee1d4078ad5748adaf4c87a642d65db8eb4
  name: factory-runner
  newName: ghcr.io/mrogan/cv-software-factory/factory-runner
# The line starts runners with the runner image it is pinned to here, so its reference goes into the line's settings.
replacements:
- source:
    kind: Deployment
    name: line
    fieldPath: spec.template.spec.initContainers.[name=runner-image].image
  targets:
  - select:
      kind: Deployment
      name: line
    fieldPaths:
    - spec.template.spec.containers.[name=line].env.[name=RUNNER_IMAGE].value
