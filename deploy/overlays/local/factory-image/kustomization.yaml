# The factory images CI built last, pinned by digest, and with them the workers that run them (deploy/base/factory), so
# the cluster never has workers without an image to run. The factory's GitHub worker moves the three digests together,
# in a pull request, when CI has built all three from a newer commit.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- ../../../base/factory
- ../../../base/runners
images:
- digest: sha256:8c9756b8329c7aa0c8a8a621eac8544af67bfd27dba02743f31c0a76a1030753
  name: factory
  newName: ghcr.io/mrogan/cv-software-factory/factory
- digest: sha256:35655e5262f4ebc97e7f1080ae8fdbd7d528bf25f8b09684cb7f6a9e257aa1c2
  name: factory-browser
  newName: ghcr.io/mrogan/cv-software-factory/factory-browser
- digest: sha256:5d7ea9a48c24300fdd41e19c5aaa8c91ee14355c71f423a8712156ab50b8f22f
  name: factory-runner
  newName: ghcr.io/mrogan/cv-software-factory/factory-runner
# The line starts runners with the runner image it is pinned to here, so its reference goes into the line's settings.
replacements:
- source:
    kind: Deployment
    name: line
    fieldPath: spec.template.spec.initContainers.[name=runner-image].image
  targets:
  - select:
      kind: Deployment
      name: line
    fieldPaths:
    - spec.template.spec.containers.[name=line].env.[name=RUNNER_IMAGE].value
