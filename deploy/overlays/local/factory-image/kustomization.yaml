# The factory images CI built last, pinned by digest, and with them the workers that run them (deploy/base/factory).
# Empty until the first build: the build workflow's deploy pull request adds the workers and pins both images in one
# change, so the cluster never has workers without an image to run. After that it moves only the two digests.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- ../../../base/factory
images:
- digest: sha256:e4d73534198bfe74453374f37da7242400cb43d18538f666e89cb684752693e2
  name: factory
  newName: ghcr.io/mrogan/cv-software-factory/factory
- digest: sha256:53dfc39e7eb7429e6d1530641ff74fcefcaafaafda170dcd66cbf408b884e841
  name: factory-browser
  newName: ghcr.io/mrogan/cv-software-factory/factory-browser
