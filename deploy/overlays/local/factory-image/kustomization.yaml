# The factory images CI built last, pinned by digest, and with them the workers that run them (deploy/base/factory), so
# the cluster never has workers without an image to run. The factory's GitHub worker moves the two digests in a pull
# request when CI builds new ones.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- ../../../base/factory
images:
- digest: sha256:4e9fa5339240f915db681d1f38dd2c84d931d7cfb1ec447ec4a3e0cce4060e88
  name: factory
  newName: ghcr.io/mrogan/cv-software-factory/factory
- digest: sha256:80582511e301c3483114124da8ab90631781c309697ffa369a42385879da00b0
  name: factory-browser
  newName: ghcr.io/mrogan/cv-software-factory/factory-browser
