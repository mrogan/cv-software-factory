# The factory images CI built last, pinned by digest, and with them the workers that run them (deploy/base/factory), the
# scoreboard (deploy/base/scoreboard) and the canary's analysis, whose journeys run on `factory-browser`
# (deploy/base/analysis), so the cluster never has any of them without an image to run. The factory's GitHub worker
# moves the three digests together, in a pull request, when CI has built all three from a newer commit.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
- ../../../base/factory
- ../../../base/runners
- ../../../base/analysis
- ../../../base/scoreboard
images:
- digest: sha256:1d60319982ba06c5eca0f545865041a5aed597c0b3b7cf694b4d6f5b6c11f7c8
  name: factory
  newName: ghcr.io/mrogan/cv-software-factory/factory
- digest: sha256:2d106130ac91ba08461009d29c5a0638b211ca1ffa90f36d76391d4af3505ab8
  name: factory-browser
  newName: ghcr.io/mrogan/cv-software-factory/factory-browser
- digest: sha256:0eb7720d14754d20a01bfa6e535501c0cf48195005f38fc7ef1c55c90ff943a4
  name: factory-runner
  newName: ghcr.io/mrogan/cv-software-factory/factory-runner
# The line starts runners with the runner image it is pinned to here, so its reference goes into the line's settings.
replacements:
- source:
    kind: Deployment
    name: line
    fieldPath: spec.template.spec.initContainers.[name=runner-image].image
  targets:
  - select:
      kind: Deployment
      name: line
    fieldPaths:
    - spec.template.spec.containers.[name=line].env.[name=RUNNER_IMAGE].value
