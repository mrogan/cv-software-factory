# The World's Worst Website on the local cluster: Argo CD deploys the local overlay in the app's own repository,
# which pins the image its CI built (ADR 0005).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: website
  namespace: argocd
spec:
  project: website
  source:
    repoURL: https://github.com/mrogan/cv-worlds-worst-website.git
    targetRevision: main
    path: deploy/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: website
  # Argo Rollouts sets the traffic split's weights at each step of a release. They are its to set: Argo CD neither
  # reports them as drift nor puts them back, even when it syncs something else mid-release.
  ignoreDifferences:
    - group: traefik.io
      kind: TraefikService
      jqPathExpressions:
        - .spec.weighted.services[].weight
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
