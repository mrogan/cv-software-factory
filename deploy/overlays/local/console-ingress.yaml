# Local only: the console at https://console.localhost:8443. Public profiles are reached through a tunnel instead.
# Traefik ends TLS with the certificate `make up` gives it in the `console-tls` Secret, from a local authority that may
# sign for `localhost` names only (scripts/local-ca.ts). Until the Secret exists, Traefik serves its own default one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  namespace: factory
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - console.localhost
      secretName: console-tls
  rules:
    - host: console.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: console
                port:
                  name: http
---
# Plain HTTP on the console's host, http://console.localhost:8080, is sent to HTTPS. The redirect is the console's
# own, not the entrypoint's, so the app's hosts keep plain HTTP. Not permanent, so no browser remembers it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: console-https
  namespace: factory
spec:
  redirectScheme:
    scheme: https
    # k3d maps the Mac's 8443 to Traefik's 443 (deploy/k3d/cluster.yaml).
    port: "8443"
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console-http
  namespace: factory
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: factory-console-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: console.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: console
                port:
                  name: http
