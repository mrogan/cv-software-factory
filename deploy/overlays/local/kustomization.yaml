# The local profile: k3d on a laptop. Argo CD's root Application renders this directory from main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - console-ingress.yaml
  - website.yaml

components:
  # The console image CI built last, pinned by digest. The build workflow edits only this file, in a pull request.
  - console-image

patches:
  - target:
      kind: Application
      name: grafana
    patch: |
      - op: add
        path: /spec/sources/0/helm/valueFiles/-
        value: $values/deploy/overlays/local/values/grafana.yaml
