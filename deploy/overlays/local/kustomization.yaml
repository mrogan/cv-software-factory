# The local profile: k3d on a laptop. Argo CD's root Application renders this directory from main.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- console-ingress.yaml

# The console image CI built last. The build workflow opens a pull request to move it on.
images:
- digest: sha256:043f8bf1cc4f092adb549bc0ca3c4b2645e8dd100abeab5dde836164f4d6583a
  name: console
  newName: ghcr.io/mrogan/cv-software-factory/console

patches:
- patch: |
    - op: add
      path: /spec/sources/0/helm/valueFiles/-
      value: $values/deploy/overlays/local/values/grafana.yaml
  target:
    kind: Application
    name: grafana
