# Every workload meets the restricted Pod Security Standard: non-root, no privilege escalation, no capabilities.
apiVersion: v1
kind: Namespace
metadata:
  name: factory
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
  labels:
    pod-security.kubernetes.io/enforce: restricted
