# Every workload meets the restricted Pod Security Standard: non-root, no privilege escalation, no capabilities.
apiVersion: v1
kind: Namespace
metadata:
  name: factory
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # before the Applications that deploy into it
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    pod-security.kubernetes.io/enforce: restricted
