# The gateway's cassettes: what each call to Jev or an agent's model sent and got back. Recordings of real reports and
# work live here and nowhere else: only the gateway mounts this volume, and nothing commits or publishes it. The
# gateway deletes each two weeks after the last thing it was for (gateway/pruning.ts). Deleting it all loses nothing
# but the recordings, and the answers a gateway with no TypeSafe key replays.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cassettes
  annotations:
    # With the gateway: the volume binds only once a pod that uses it is scheduled.
    argocd.argoproj.io/sync-wave: "2"
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
