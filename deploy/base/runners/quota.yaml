# What runners may take of the node, together: a few steps at a time. A loop in the line, or a flood of steps, stops
# here rather than filling the node. The quota counts memory and CPU limits, so the LimitRange gives every container
# that sets none a default limit and request: the Jobs set their own (runners/jobs.ts), a pod made by hand gets these.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: runners
spec:
  hard:
    count/jobs.batch: "8"
    pods: "8"
    persistentvolumeclaims: "6"
    requests.storage: 12Gi
    requests.memory: 4Gi
    limits.memory: 12Gi
    limits.cpu: "8"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: runners
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
