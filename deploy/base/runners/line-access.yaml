# The line may start runners: create, read and delete Jobs, and the volume each work item's Jobs share. Nothing else,
# here or anywhere: it cannot read a Secret or exec into a pod. A Job it makes can run any command, but only here, under
# the restricted standard the namespace enforces, within its quota (quota.yaml), and fenced by its labels. Admission
# limits its images to the factory's own, signed, and the few others `factory-images` names by digest
# (deploy/base/admission/factory): any other is refused, but for a run on images built on the Mac, which switches
# that policy to Audit (the `try-the-line` skill, ADR 0010).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: line
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, delete]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: line
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: line
subjects:
  - kind: ServiceAccount
    name: line
    namespace: factory
