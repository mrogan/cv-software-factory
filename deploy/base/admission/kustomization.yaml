# Admission control (ADR 0010): Kyverno, in a namespace of its own, and the policies that admit a pod in a guarded
# namespace only if its images were signed by the pipeline that built them. Installed before anything it guards: the
# project, namespace and fences in wave -4, Kyverno in -3, the policies in -2, and everything else from -1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - project.yaml
  - namespace.yaml
  - network-policies.yaml
  - kyverno.yaml
  - factory
  - website

# Until every image the guarded namespaces pin is a digest build.yml signed, both policies only audit: they record what
# they would refuse (`kubectl get policyreports -A`) and refuse nothing. `make admission-ready` says when that is; then
# this patch goes, in a pull request of its own, and the policies enforce.
patches:
  - target:
      kind: ImageValidatingPolicy
    patch: |
      - op: replace
        path: /spec/validationActions
        value: [Audit]
