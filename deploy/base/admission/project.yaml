# What Kyverno's Application may deploy: its chart, into its own namespace, with the cluster-scoped kinds a chart that
# installs an admission controller needs (its CRDs, and its roles). The policies themselves are this repository's, in
# deploy/base/admission, applied by the root Application.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: admission
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4" # before the Application that references it
spec:
  description: Kyverno, which admits a pod in a guarded namespace only if its images were signed by their pipeline.
  sourceRepos:
    - https://github.com/mrogan/cv-software-factory.git
    - https://kyverno.github.io/kyverno
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kyverno
  clusterResourceWhitelist:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
