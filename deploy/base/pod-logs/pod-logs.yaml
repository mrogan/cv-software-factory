apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pod-logs
  namespace: argocd
spec:
  project: software-factory
  destination:
    server: https://kubernetes.default.svc
    namespace: pod-logs
  sources:
    # The chart and version of the collector in `telemetry` (deploy/base/telemetry/otel-collector.yaml): the two move
    # together.
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: 0.174.0
      helm:
        releaseName: pod-logs
        valueFiles:
          - $values/deploy/base/pod-logs/values.yaml
    - repoURL: https://github.com/mrogan/cv-software-factory.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
