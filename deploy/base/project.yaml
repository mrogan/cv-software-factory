# What the factory's Applications may deploy, and from where: this repository and the chart repositories it pins.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: software-factory
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1" # before the Applications that reference it
spec:
  description: The factory, its telemetry, its database and the controller that releases the app.
  sourceRepos:
    - https://github.com/mrogan/cv-software-factory.git
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://argoproj.github.io/argo-helm
  destinations:
    - server: https://kubernetes.default.svc
      namespace: telemetry
    - server: https://kubernetes.default.svc
      namespace: factory
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
  clusterResourceWhitelist:
    # Argo Rollouts' kinds: Rollout, AnalysisRun and the rest.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
