# Everything in `website` is denied, in and out, and then each pod there is let through by its own policy: the app's
# below, and the canary's journeys Job's (deploy/base/analysis/network-policy.yaml). The app's repository, which agents
# write, gives the app's pods their labels, so a pod it labelled otherwise would match neither policy; this keeps such a
# pod reaching nothing and reached by nothing, Traefik included, rather than open to every pod in the cluster. The
# kubelet's health checks come from the node, which k3s's policy controller always lets through.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: website
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# The app's fence. Agents write the app's code, so its pods may reach no more than serving its pages needs: DNS; the
# collector on OTLP over HTTP (4318), where it sends its telemetry; and flagd's sync port (8015), from which its
# in-process provider streams the flag set (deploy/base/flagd). Not flagd's other ports, its management port (8014)
# among them, Prometheus, Loki, Tempo, Postgres, the gateway, the Kubernetes API or the internet. They are reached on
# 8080 only by Traefik, which serves the app's visitors and splits a release's traffic; the probes and the crawler,
# from the factory's namespace; the admin service, which asks each pod for the revision of the flag set it holds
# (apps/factory/src/admin/flags-held.ts); and the canary's analysis Job.
#
# It selects the stable and the canary pods alike, by the label the app's repository gives them. The app's AppProject
# cannot create a NetworkPolicy, so nothing there can widen this. The kubelet's health checks come from the node, which
# k3s's policy controller always lets through.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: website
  namespace: website
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: website
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: factory
          podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [probes, crawler, admin] }
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: journeys
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: telemetry
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - { protocol: TCP, port: 4318 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flagd
          podSelector:
            matchLabels:
              app.kubernetes.io/name: flagd
      ports:
        - { protocol: TCP, port: 8015 }
