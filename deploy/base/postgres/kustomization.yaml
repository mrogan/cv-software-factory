# Postgres as a plain StatefulSet: the event store, and the work queue from milestone 4. The passwords (its own,
# the factory's writer's and the console's) are Secrets that `make up` creates and nothing commits.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: factory
labels:
  - pairs:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: software-factory
    includeSelectors: true
resources:
  - statefulset.yaml
  - service.yaml
