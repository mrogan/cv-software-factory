# The journeys' fence. The analysis Job runs in `website`, beside the app it compares, and may reach the app's pods (the
# stable and the canary, behind their Services' port 80) and DNS, and nothing else: not the factory, the telemetry, the
# Kubernetes API or the internet. Chromium follows whatever a page links to; this keeps it in the shop.
#
# It selects the journeys' pods only. Nothing else in `website` is denied, so the app still takes its traffic from
# Traefik, the senses and the analysis, and sends its telemetry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: journeys
  namespace: website
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: journeys
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: website
      ports:
        - { protocol: TCP, port: 8080 }
