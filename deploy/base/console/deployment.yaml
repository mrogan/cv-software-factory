apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  annotations:
    # After Postgres (wave 0) and the migrations (wave 1).
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          # Each profile pins the image by digest (kustomize `images:`), so a deploy is always a commit.
          image: console
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.telemetry:4318
            - name: OTEL_SERVICE_NAME
              value: console
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=software-factory
            # Every 15s rather than the default minute, so rates settle quickly (and canary analysis, later, too).
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            # The event store, as the console's role: it can read public views and nothing else.
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: factory
            - name: PGUSER
              value: console_reader
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-console
                  key: password
            - name: ARTIFACTS_DIR
              value: /var/lib/factory/artifacts
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/factory/artifacts
              readOnly: true
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: artifacts
