# The scoreboard's fence. It holds the answer key, so it reaches the event store, to read the tickets and append its
# figures, and DNS, to find it, and nothing else: not the collector, the gateway, the Kubernetes API or the internet.
# Nothing reaches it: it serves nothing, and no rule lets anything in.
#
# One policy for every pod in the namespace, so a pod started here beside it is fenced the same. Postgres lets it in
# by this namespace and its label (deploy/base/factory/network-policies.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scoreboard
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: factory
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - { protocol: TCP, port: 5432 }
