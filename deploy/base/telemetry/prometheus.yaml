apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: software-factory
  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 29.35.0
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/deploy/base/telemetry/values/prometheus.yaml
          - $values/deploy/base/telemetry/values/prometheus-rules.yaml
    - repoURL: https://github.com/mrogan/cv-software-factory.git
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
