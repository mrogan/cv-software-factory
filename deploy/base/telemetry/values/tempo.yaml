# Tempo in monolithic mode, taking traces over OTLP.
tempo:
  reportingEnabled: false
  retention: 72h
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  # The restricted Pod Security Standard, which the telemetry namespace enforces.
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Go collects hard before the kernel kills: 90% of the limit above, in bytes, as Prometheus sets for itself.
  extraEnv:
    - name: GOMEMLIMIT
      value: "966367641"
  # One search is split into jobs, a block or so each, and the querier runs this many at once across every search: the
  # bound on what searches hold in memory together. Tempo's defaults run 20 batches of up to 7 jobs each, every job of a
  # batch at once; one job a batch makes the bound eight jobs. The factory's reads take one to a dozen jobs.
  querier:
    max_concurrent_queries: 8
  # The factory's widest read covers ten minutes (the environment check's search; the agreement check's metrics query
  # covers five) and asks for one trace. A day covers Grafana's Explore in ordinary use; a wider look is several
  # searches. A search asking for more traces than the limit is refused. A metrics query's day is Tempo's default,
  # stated beside the search's.
  queryFrontend:
    max_batch_size: 1
    search:
      max_duration: 24h
      max_result_limit: 1000
    metrics:
      max_duration: 24h
  # The backend worker asks the scheduler for compaction and retention jobs, waits 15 seconds for one, and logs each
  # empty answer as a warning and again as an error, backing off between asks. Backing off up to five minutes, not
  # Tempo's one, takes an idle hour's asks from about 80 to about 15; a job waits up to that much longer to start,
  # which compaction and a 72-hour retention bear. After a job the worker asks again at once.
  backendWorker:
    backoff:
      max_period: 5m
persistence:
  enabled: true
  size: 4Gi
# Its own metrics, on its HTTP port, for Prometheus to scrape.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3200"
# Pod-level, despite the chart's name for it.
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
