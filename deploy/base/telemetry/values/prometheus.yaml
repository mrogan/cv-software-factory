# Prometheus takes the collector's metrics over OTLP and Tempo's service graph over remote write, and still scrapes the
# cluster itself. Its alerting and recording rules are generated from policy/objectives.ts and policy/stuck.ts into
# prometheus-rules.yaml, which the Application loads after this file.
#
# Among what it scrapes is Traefik, k3s's ingress: its pod asks to be scraped on its metrics port alone (9100, with
# `prometheus.io/` annotations), which the chart's `kubernetes-pods` job does. The canary's analysis counts the
# requests the traffic split sends the canary there (`traefik_service_requests_total`, release/analysis.ts).
#
# The platform's components ask the same way, each through its chart's settings, so their own metrics are kept too: the
# collector, Loki, Tempo and Alertmanager here; the pod log collector (pod-logs/values.yaml), Argo Rollouts
# (rollouts/values.yaml), Kyverno (admission/values) and Argo CD (deploy/argocd/values.yaml). Prometheus scrapes itself
# in its own job.
#
# Alertmanager sends each alert by the level its rule gives it, in a `level` label (docs/COMPONENTS/ALERTING.md):
#
# - `page`, `notify` and `inform` go to Martin's phone through Pushover, at high priority (sounding through quiet
#   hours), at normal priority, and at low priority (with no sound or vibration);
# - an alert with none of them is for the dashboards only, and goes to a receiver that sends nothing;
# - the app's objective alerts, which carry no level, go to the factory's intake, which turns each into a signal. An
#   alert with a level never reaches it: an alert to Martin is not a signal for the senses.
#
# Pushover's application token and Martin's user key are in the `pushover` Secret, which `make up` makes from the
# Keychain (`make pushover-key`). It is mounted optional, so a cluster with no Pushover account still comes up and still
# routes to the intake; each message to Martin then fails to send, which Alertmanager's own metrics count. Alertmanager
# reads the files each time it sends, so a key added later is used without a restart. Until the intake is deployed,
# deliveries to it fail and Alertmanager retries them. The sub-chart's defaults already meet the restricted Pod Security
# Standard.
#
# Its first NetworkPolicy, alertmanager-fence.yaml, lets it reach the intake, DNS and the internet on 443, and lets in
# only Prometheus and Grafana: anything that reached it could silence a page.
alertmanager:
  enabled: true
  # Its own metrics, among them the deliveries that failed, by receiver, on its HTTP port.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9093"
  # One replica, so no peers: with the cluster's address empty, Alertmanager listens on no gossip port (9094).
  extraArgs:
    cluster.listen-address: ""
  extraSecretMounts:
    - name: pushover
      mountPath: /etc/pushover
      # The chart writes a subPath for every mount: empty, the whole Secret is the folder.
      subPath: ""
      secretName: pushover
      readOnly: true
      optional: true
  persistence:
    size: 100Mi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  # The message to Martin, which each Pushover receiver below sends. For a hold, two links: its work item's sheet in the
  # console, at the profile's origin (`console.origin`, which each overlay defines, as the console's address is the
  # profile's), and its pull request in the app's repository, if it has one. The rules let a hold alert only with
  # numbers in those labels (apps/factory/src/alerts/rules.ts), and html/template escapes them as a link's query or
  # path whatever they hold. Newlines may read as spaces in Pushover's HTML: each line ends a sentence, so it reads
  # either way.
  templates:
    martin.tmpl: |-
      {{ define "martin.message" }}{{ range .Alerts.Firing }}{{ or .Annotations.description .Annotations.summary .Labels.alertname }}
      Firing since {{ .StartsAt.UTC.Format "15:04 UTC, 2 January" }}.{{ with .Labels.work_item }}
      <a href="{{ template "console.origin" }}/?item={{ . }}&sheet">#{{ . }} in the console</a>{{ end }}{{ $deploy := eq .Labels.cause "deploy" }}{{ with .Labels.pull_request }} · <a href="https://github.com/mrogan/cv-worlds-worst-website/pull/{{ . }}">{{ if $deploy }}Deploy{{ else }}Pull request{{ end }} #{{ . }}</a>{{ end }}{{ end }}{{ end }}
  config:
    # The chart's ConfigMap holds the templates beside the configuration, in the folder it is mounted at.
    templates:
      - /etc/alertmanager/*.tmpl
    route:
      # Dashboard only: an alert that no route below takes.
      receiver: dashboard
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
      routes:
        - receiver: intake
          matchers: ['objective=~".+"', 'level=""']
          # Alerts of one route and objective arrive together; a quiet app has few.
          group_by: [route, objective]
          # A rule that still fires is told to the intake again every hour, and triage counts it as seen again.
          repeat_interval: 1h
        # Each alert to Martin is a message of its own, never folded into another's. One that still fires is sent again
        # every four hours, Alertmanager's default.
        - receiver: page
          matchers: [level="page"]
          group_by: ["..."]
        - receiver: notify
          matchers: [level="notify"]
          group_by: ["..."]
        - receiver: inform
          matchers: [level="inform"]
          group_by: ["..."]
    receivers:
      - name: dashboard
      - name: intake
        webhook_configs:
          # Resolved alerts say nothing the senses need: a ticket closes when its fix is verified.
          - url: http://intake.factory.svc:8080/v1/alerts
            send_resolved: false
      - name: page
        pushover_configs:
          - &pushover
            token_file: /etc/pushover/app-token
            user_key_file: /etc/pushover/user-key
            # Sounds through Martin's quiet hours. Emergency (2), which repeats until acknowledged, would repeat at
            # each of his own sign-ins.
            priority: "1"
            # What happened and when, from the rule's summary and description, and for a hold the links to answer it
            # by (`martin.message`, above). Of the labels, only the alert's name, and a hold's two numbers and its cause.
            title: '{{ or .CommonAnnotations.summary .CommonLabels.alertname }}'
            message: '{{ template "martin.message" . }}'
            # Pushover's HTML, for links in the message: Alertmanager renders the message with Go's html/template, which
            # escapes each value for where it lands, a description's text or a link's address.
            html: true
            # No link below the message: Alertmanager's default is its own address, which the phone cannot reach. A
            # hold's links are in the message, both of them, where its words are.
            url: ""
            # A resolved alert would be a second message about the same thing.
            send_resolved: false
      - name: notify
        pushover_configs:
          - <<: *pushover
            priority: "0"
      # Silent: no sound or vibration, at any hour.
      - name: inform
        pushover_configs:
          - <<: *pushover
            priority: "-1"
# kube-state-metrics: each pod's restarts, readiness and start, and each Deployment's, StatefulSet's, DaemonSet's and
# Job's replicas and outcomes, read from the Kubernetes API. It asks to be scraped as Traefik does, with
# `prometheus.io/` annotations on its pod, rather than on the Service the chart would annotate. The scrape keeps the
# `namespace` and `pod` its series name (the `kubernetes-pods` job honours their labels), not its own.
#
# Only the collectors those need, so its role may list and watch those kinds and nothing else: not Secrets or
# ConfigMaps, whose names and labels the default collectors would read cluster-wide, the scoreboard's among them.
kube-state-metrics:
  enabled: true
  prometheusScrape: false
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
  collectors:
    - daemonsets
    - deployments
    - jobs
    - nodes
    - persistentvolumeclaims
    - pods
    - statefulsets
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 256Mi
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

# Prometheus reloads its configuration and rules itself when they change (`config.auto-reload`, every 30 seconds), so
# it needs no sidecar to tell it to, and no lifecycle endpoints: with `web.enable-lifecycle` off, nothing that reaches
# Prometheus can stop it or have it reload. The chart's sidecar would POST to /-/reload, which needs them on.
configmapReload:
  prometheus:
    enabled: false

server:
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # The restricted Pod Security Standard, which the telemetry namespace enforces.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  # The collector writes metrics to the OTLP receiver, and Tempo its service graph to the remote-write receiver. The
  # factory's workers reach Prometheus only through the read-only proxy (query.yaml), which passes no write, and only
  # the platform's own pods reach it at all (prometheus-fence.yaml).
  extraFlags:
    - config.auto-reload
    - web.enable-otlp-receiver
    - web.enable-remote-write-receiver
  # The chart's `retention` and `retentionSize` pass flags Prometheus has deprecated for the configuration file's
  # `storage.tsdb.retention`; empty, the chart passes no flag.
  retention: ""
  persistentVolume:
    size: 4Gi
  tsdb:
    # OTLP batches can arrive a little out of order.
    out_of_order_time_window: 30m
    # Seven days, or less when they would outgrow the volume: past the size, counting blocks and write-ahead log,
    # Prometheus deletes its oldest blocks. It checks only after compaction, which writes a block before it deletes the
    # ones it replaces, and the head grows in between; its units are binary, so 3GB is 3GiB, and the last quarter of
    # the volume is left for that, and for the filesystem's own. A volume in the cloud refuses a write past its size;
    # `local-path`, on the Mac, does not, so only this keeps it in.
    retention:
      time: 7d
      size: 3GB
  otlp:
    promote_resource_attributes:
      - service.namespace
      - service.version
      - deployment.environment.name
      # Which of a release's two versions a series is from: the stable's hash or the canary's (otel-collector.yaml).
      - k8s.pod.label.rollouts-pod-template-hash
      # Which factory worker a series is from, by its pod's namespace and name label, which only the collector sets: the
      # alerts to Martin read the line's own counts by them (otel-collector.yaml, provenance.ts).
      - k8s.namespace.name
      - k8s.pod.label.app.kubernetes.io/name
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# What asks to be scraped, by pod or by Service, is scraped only in the namespaces the platform runs in: Traefik and
# CoreDNS in kube-system, Argo CD, Argo Rollouts, Kyverno, the telemetry stack, the pod log collector, and the Postgres
# exporter in factory, whose pods are built from this repository. Not `website`, whose pods come from the app's
# repository, which the line changes, nor `runners`, where agents run, nor `scoreboard`. A pod there that asked would
# be a target behind a fence Prometheus cannot pass, down for as long as it asked; and one Prometheus could reach would
# keep the labels it sent (`honor_labels`, the chart's default), the one that marks the app's own metrics among them
# (provenance.ts). A namespace the platform starts to run a target in is a name here. And whatever is scraped, that
# label is dropped from it, as are the two that mark the line's own counts, which page Martin: only the collector
# stamps them, on what arrives over OTLP.
#
# `target_info` is a service that sends metrics over OTLP, and triage counts those to see that metrics still arrive
# (environment.ts). The collector also serves its own where it is scraped, as may any SDK's exporter, which would be
# counted after OTLP had stopped, so each job that scrapes what asks to be scraped drops it. The rest stays.
#
# Two kinds of series are dropped as they are scraped, since nothing reads them and they are much of what Prometheus
# keeps: every histogram's buckets from the nodes' endpoint, the kubelet's and, on k3s, the control plane's, one series
# for each bucket of each operation (about 6,800 of 46,000 head series on 19 October; their `_count` and `_sum` stay,
# enough for rates and mean latencies), and the Postgres exporter's `pg_settings_*`, Postgres's configuration,
# constant and 284 series, of which only `max_connections` is read, against the connections in use.
#
# The chart's two jobs for Services that ask to be probed (`kubernetes-services`, through a blackbox exporter, and
# `prometheus-pushgateway`) are off: neither a blackbox exporter nor a Pushgateway runs here, so a Service that asked
# would only be a target down.
scrapeConfigs:
  kubernetes-pods:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: &platform [argo-rollouts, argocd, factory, kube-system, kyverno, pod-logs, telemetry]
    metric_relabel_configs: &scraped
      - source_labels: [__name__]
        regex: target_info
        action: drop
      - regex: k8s_pod_label_rollouts_pod_template_hash
        action: labeldrop
      - regex: k8s_namespace_name|k8s_pod_label_app_kubernetes_io_name
        action: labeldrop
      # Every `pg_settings_*` but `max_connections`: marked, dropped unless marked, and the mark taken off.
      - source_labels: [__name__]
        regex: pg_settings_max_connections
        target_label: keep_setting
        replacement: "true"
      - source_labels: [__name__, keep_setting]
        regex: pg_settings_.+;
        action: drop
      - regex: keep_setting
        action: labeldrop
  kubernetes-pods-slow:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: *platform
    metric_relabel_configs: *scraped
  kubernetes-service-endpoints:
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: *platform
    metric_relabel_configs: *scraped
  kubernetes-service-endpoints-slow:
    kubernetes_sd_configs:
      - role: endpointslice
        namespaces:
          names: *platform
    metric_relabel_configs: *scraped
  kubernetes-nodes:
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: .+_bucket
        action: drop
  kubernetes-services:
    enabled: false
  prometheus-pushgateway:
    enabled: false
