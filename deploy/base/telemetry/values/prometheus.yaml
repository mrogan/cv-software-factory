# Prometheus takes the collector's metrics over OTLP, and still scrapes the cluster itself. Its alerting rules are
# generated from policy/objectives.ts into prometheus-rules.yaml, which the Application loads after this file.
#
# Among what it scrapes is Traefik, k3s's ingress: its pod asks to be scraped on its metrics port alone (9100, with
# `prometheus.io/` annotations), which the chart's `kubernetes-pods` job does. The canary's analysis counts the
# requests the traffic split sends the canary there (`traefik_service_requests_total`, release/analysis.ts).
#
# The platform's components ask the same way, each through its chart's settings, so their own metrics are kept too: the
# collector, Loki, Tempo and Alertmanager here; Argo Rollouts (rollouts/values.yaml), Kyverno (admission/values) and
# Argo CD (deploy/argocd/values.yaml). Prometheus scrapes itself in its own job.
#
# Alertmanager has one receiver: the factory's intake, which turns each firing alert into a signal. Until the intake
# is deployed, deliveries fail and Alertmanager retries them. The sub-chart's defaults already meet the restricted
# Pod Security Standard.
alertmanager:
  enabled: true
  # Its own metrics, among them the deliveries to the intake that failed, on its HTTP port.
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9093"
  persistence:
    size: 100Mi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  config:
    route:
      receiver: intake
      # Alerts of one route and objective arrive together; a quiet app has few.
      group_by: [route, objective]
      group_wait: 10s
      group_interval: 1m
      # A rule that still fires is told to the intake again every hour, and triage counts it as seen again.
      repeat_interval: 1h
    receivers:
      - name: intake
        webhook_configs:
          # Resolved alerts say nothing the senses need: a ticket closes when its fix is verified.
          - url: http://intake.factory.svc:8080/v1/alerts
            send_resolved: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

# Prometheus reloads its configuration and rules itself when they change (`config.auto-reload`, every 30 seconds), so
# it needs no sidecar to tell it to, and no lifecycle endpoints: with `web.enable-lifecycle` off, nothing that reaches
# Prometheus can stop it or have it reload. The chart's sidecar would POST to /-/reload, which needs them on.
configmapReload:
  prometheus:
    enabled: false

server:
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # The restricted Pod Security Standard, which the telemetry namespace enforces.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  # The collector writes metrics to the OTLP receiver. The factory's workers reach Prometheus only through the
  # read-only proxy (query.yaml), which passes no write.
  extraFlags:
    - config.auto-reload
    - web.enable-otlp-receiver
  # The chart's `retention` and `retentionSize` pass flags Prometheus has deprecated for the configuration file's
  # `storage.tsdb.retention`; empty, the chart passes no flag.
  retention: ""
  persistentVolume:
    size: 4Gi
  tsdb:
    # OTLP batches can arrive a little out of order.
    out_of_order_time_window: 30m
    # Seven days, or less when they would outgrow the volume: past the size, counting blocks and write-ahead log,
    # Prometheus deletes its oldest blocks. It checks only after compaction, which writes a block before it deletes the
    # ones it replaces, and the head grows in between; its units are binary, so 3GB is 3GiB, and the last quarter of
    # the volume is left for that, and for the filesystem's own. A volume in the cloud refuses a write past its size;
    # `local-path`, on the Mac, does not, so only this keeps it in.
    retention:
      time: 7d
      size: 3GB
  otlp:
    promote_resource_attributes:
      - service.namespace
      - service.version
      - deployment.environment.name
      # Which of a release's two versions a series is from: the stable's hash or the canary's (otel-collector.yaml).
      - k8s.pod.label.rollouts-pod-template-hash
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# `target_info` is a service that sends metrics over OTLP, and triage counts those to see that metrics still arrive
# (environment.ts). The collector also serves its own where it is scraped, as may any SDK's exporter, which would be
# counted after OTLP had stopped, so it is dropped from what the `kubernetes-pods` job scrapes. The rest of it stays.
scrapeConfigs:
  kubernetes-pods:
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: target_info
        action: drop
