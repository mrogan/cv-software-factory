# Prometheus takes the collector's metrics over OTLP, and still scrapes the cluster itself. Its alerting rules are
# generated from policy/objectives.ts into prometheus-rules.yaml, which the Application loads after this file.
#
# Alertmanager has one receiver: the factory's intake, which turns each firing alert into a signal. Until the intake
# is deployed, deliveries fail and Alertmanager retries them. The sub-chart's defaults already meet the restricted
# Pod Security Standard.
alertmanager:
  enabled: true
  persistence:
    size: 100Mi
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
  config:
    route:
      receiver: intake
      # Alerts of one route and objective arrive together; a quiet shop has few.
      group_by: [route, objective]
      group_wait: 10s
      group_interval: 1m
      # A rule that still fires is told to the intake again every hour, and triage counts it as seen again.
      repeat_interval: 1h
    receivers:
      - name: intake
        webhook_configs:
          # Resolved alerts say nothing the senses need: a ticket closes when its fix is verified.
          - url: http://intake.factory.svc:8080/v1/alerts
            send_resolved: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false

# The restricted Pod Security Standard, which the telemetry namespace enforces.
configmapReload:
  prometheus:
    containerSecurityContext: &restricted
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

server:
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext: *restricted
  extraFlags:
    - web.enable-lifecycle
    - web.enable-otlp-receiver
  retention: 7d
  persistentVolume:
    size: 4Gi
  tsdb:
    # OTLP batches can arrive a little out of order.
    out_of_order_time_window: 30m
  otlp:
    promote_resource_attributes:
      - service.namespace
      - service.version
      - deployment.environment.name
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
