# One OTLP endpoint for every service in the cluster. Traces go to Tempo, metrics to Prometheus, logs to Loki.
fullnameOverride: otel-collector
mode: deployment
image:
  repository: otel/opentelemetry-collector-k8s

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    # Only the collector says which pod a record came from. k8s_attributes leaves alone an attribute a record already
    # carries, so without these the app's own code could name another pod, or claim the stable version's hash for the
    # canary's telemetry and pass its analysis. Both run first in every pipeline that runs k8s_attributes: the first
    # on what a record says of its source, the second on a data point's, span's or log's own attributes, which
    # Prometheus puts before the source's when both give a series the same label. The pattern takes any separators,
    # as Prometheus turns each into an underscore. Nothing else in the cluster sets these.
    resource/drop-pod-claims:
      attributes:
        - pattern: (?i)^k8s[^a-z0-9]+pod[^a-z0-9]
          action: delete
    attributes/drop-pod-claims:
      actions:
        - pattern: (?i)^k8s[^a-z0-9]+pod[^a-z0-9]
          action: delete
    # Each record from the app gains its pod's name and its rollouts-pod-template-hash label, which Argo Rollouts gives
    # the stable version's pods and the canary's each their own: the canary's analysis tells the two apart by it. The
    # pod is found by the address its record came from, so this runs before batching, which forgets it. Only the app's
    # namespace is watched, and only it may be read (collector-reads-website.yaml); telemetry from anywhere else passes
    # through unchanged.
    k8s_attributes:
      filter:
        namespace: website
      pod_association:
        - sources:
            - from: connection
      extract:
        metadata: [k8s.pod.name]
        labels:
          - tag_name: k8s.pod.label.rollouts-pod-template-hash
            key: rollouts-pod-template-hash
            from: pod
  exporters:
    otlp_http/tempo:
      endpoint: http://tempo:4318
    otlp_http/prometheus:
      endpoint: http://prometheus-server/api/v1/otlp
    otlp_http/loki:
      endpoint: http://loki:3100/otlp
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, resource/drop-pod-claims, attributes/drop-pod-claims, k8s_attributes, batch]
        exporters: [otlp_http/tempo]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, resource/drop-pod-claims, attributes/drop-pod-claims, k8s_attributes, batch]
        exporters: [otlp_http/prometheus]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, resource/drop-pod-claims, attributes/drop-pod-claims, k8s_attributes, batch]
        exporters: [otlp_http/loki]

# The restricted Pod Security Standard, which the telemetry namespace enforces.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
