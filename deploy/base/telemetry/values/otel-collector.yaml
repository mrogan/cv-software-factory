# One OTLP endpoint for every service in the cluster. Traces go to Tempo, metrics to Prometheus, logs to Loki.
fullnameOverride: otel-collector
mode: deployment
image:
  repository: otel/opentelemetry-collector-k8s

# Its own metrics (what it took in, refused and failed to send, by pipeline) are served on 8888 at the pod's address,
# where the chart's settings put them, and Prometheus scrapes them there.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8888"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  processors:
    # Only the collector says which pod a record came from. k8s_attributes leaves alone an attribute a record already
    # carries, so without these the app's own code could name another pod, or claim the stable version's hash for the
    # canary's telemetry and pass its analysis; and a worker could claim to be the line, whose counts page Martin
    # (k8s_attributes/factory). Both run first in every pipeline that runs k8s_attributes: the first
    # on what a record says of its source, the second on a data point's, span's or log's own attributes, which
    # Prometheus puts before the source's when both give a series the same label. Prometheus turns every character but
    # an ASCII letter or digit into an underscore and keeps case, so the pattern takes any run of those between `k8s`
    # and `pod`, and no case-folding, which in Go would let a non-ASCII `ſ` or `K` through. Nothing else in the cluster
    # sets these, or a namespace's.
    resource/drop-pod-claims:
      attributes:
        - pattern: ^k8s[^a-zA-Z0-9]+(pod|namespace)[^a-zA-Z0-9]
          action: delete
    attributes/drop-pod-claims:
      actions:
        - pattern: ^k8s[^a-zA-Z0-9]+(pod|namespace)[^a-zA-Z0-9]
          action: delete
    # Each record from the app gains its pod's name and its rollouts-pod-template-hash label, which Argo Rollouts gives
    # the stable version's pods and the canary's each their own: the canary's analysis tells the two apart by it. The
    # pod is found by the address its record came from, so this runs before batching, which forgets it. Only the app's
    # namespace is watched, and only it may be read (collector-reads-website.yaml); telemetry from anywhere else passes
    # through unchanged. So these stamps also say which records are the app's: any worker may name itself `website`,
    # and the senses read only stamped records as the app's (apps/factory/src/provenance.ts).
    k8s_attributes:
      filter:
        namespace: website
      pod_association:
        - sources:
            - from: connection
      extract:
        metadata: [k8s.pod.name]
        labels:
          - tag_name: k8s.pod.label.rollouts-pod-template-hash
            key: rollouts-pod-template-hash
            from: pod
    # Each metric from a factory worker's pod gains its namespace and its `app.kubernetes.io/name` label, found the same
    # way, so the alerts to Martin read the line's counts of his security events and holds as the line's alone
    # (apps/factory/src/provenance.ts): any worker may name itself `line`. Only `factory` is watched, and only it may be
    # read (collector-reads-factory.yaml). Metrics only: the logs and traces have no reader that needs it, and Loki would
    # make a stream label of the namespace. Not the pod's name, which marks the app's logs as the app's.
    k8s_attributes/factory:
      filter:
        namespace: factory
      pod_association:
        - sources:
            - from: connection
      extract:
        metadata: [k8s.namespace.name]
        labels:
          - tag_name: k8s.pod.label.app.kubernetes.io/name
            key: app.kubernetes.io/name
            from: pod
    # Nothing kept says who a visitor is. A span or log record from anyone, the app, the console and the admin service
    # among them, loses every address of the client or the peer it came from, every request header a sender captured
    # (the proxy's `X-Forwarded-For` among them), and the browser's whole user agent. A server span keeps of the browser
    # only its family, its major version, its operating system and whether it is mobile (a phone or a tablet; an iPad's
    # Safari says it is a Mac) or a computer, read with OTTL's UserAgent(); and `traffic`, which says whether the
    # factory's traffic generator sent it (its user agent is its name) or a visitor did. A sender's own values of these
    # go first, so each is one of the few set here. The probes, the crawler and the journeys send `x-unmeasured`, which
    # the app records nothing of. Logs keep no browser at all: no log record carries one. It runs after
    # k8s_attributes, which finds the pod by the connection, not by any attribute here. What a pod writes to its own
    # output reaches Loki through the pod log collector, not this one: the app and the console write no address there.
    transform/visitors:
      error_mode: ignore
      trace_statements:
        - statements:
            - delete_matching_keys(span.attributes, "^(browser\\.(name|major)|os\\.name|device\\.type|traffic)$")
            - set(span.cache["agent"], span.attributes["user_agent.original"]) where span.kind == SPAN_KIND_SERVER
            - set(span.cache["agent"], span.attributes["http.user_agent"]) where span.kind == SPAN_KIND_SERVER and span.cache["agent"] == nil
            - set(span.cache["ua"], UserAgent(span.cache["agent"])) where span.cache["agent"] != nil
            - set(span.attributes["browser.name"], "other") where span.cache["agent"] != nil
            - set(span.attributes["browser.name"], "Edge") where IsMatch(span.cache["ua"]["user_agent.name"], "^Edge( Mobile)?$")
            - set(span.attributes["browser.name"], "Chrome") where IsMatch(span.cache["ua"]["user_agent.name"], "^(Chrome( Mobile( iOS| WebView)?)?|Chromium)$")
            - set(span.attributes["browser.name"], "Firefox") where IsMatch(span.cache["ua"]["user_agent.name"], "^Firefox( Mobile| iOS)?$")
            - set(span.attributes["browser.name"], "Safari") where IsMatch(span.cache["ua"]["user_agent.name"], "^(Mobile )?Safari$")
            - set(span.attributes["browser.major"], ExtractPatterns(span.cache["ua"]["user_agent.version"], "^(?P<major>[0-9]{1,4})")["major"]) where span.attributes["browser.name"] != nil and span.attributes["browser.name"] != "other"
            - set(span.attributes["os.name"], "other") where span.cache["agent"] != nil
            - set(span.attributes["os.name"], "macOS") where span.cache["ua"]["os.name"] == "Mac OS X"
            - set(span.attributes["os.name"], "iOS") where span.cache["ua"]["os.name"] == "iOS"
            - set(span.attributes["os.name"], "Android") where span.cache["ua"]["os.name"] == "Android"
            - set(span.attributes["os.name"], "Windows") where span.cache["ua"]["os.name"] == "Windows"
            - set(span.attributes["os.name"], "ChromeOS") where span.cache["ua"]["os.name"] == "Chrome OS"
            - set(span.attributes["os.name"], "Linux") where IsMatch(span.cache["ua"]["os.name"], "^(Linux|Ubuntu|Debian|Fedora|Red Hat|SUSE|openSUSE|Mint|Arch Linux|Gentoo)$")
            - set(span.attributes["device.type"], "desktop") where span.cache["agent"] != nil
            - set(span.attributes["device.type"], "mobile") where span.cache["agent"] != nil and IsMatch(span.cache["agent"], "Mobi|Android|iPhone|iPad|iPod")
            - set(span.attributes["traffic"], "visitor") where span.cache["agent"] != nil
            - set(span.attributes["traffic"], "factory") where span.cache["agent"] == "software-factory-traffic"
            - delete_matching_keys(span.attributes, "^(user_agent\\.original|http\\.user_agent)$")
            - delete_matching_keys(span.attributes, "^(client\\.(address|port)|network\\.peer\\.(address|port)|net\\.peer\\.(ip|port|name)|net\\.sock\\.peer\\.(addr|port)|http\\.client_ip|http\\.request\\.header\\..+)$")
      log_statements:
        - statements:
            - delete_matching_keys(log.attributes, "^(browser\\.(name|major)|os\\.name|device\\.type|traffic)$")
            - delete_matching_keys(log.attributes, "^(user_agent\\.original|http\\.user_agent)$")
            - delete_matching_keys(log.attributes, "^(client\\.(address|port)|network\\.peer\\.(address|port)|net\\.peer\\.(ip|port|name)|net\\.sock\\.peer\\.(addr|port)|http\\.client_ip|http\\.request\\.header\\..+)$")
    # The count below is a delta for each batch of spans, timed by its spans. Prometheus takes a running total, so each
    # is timed as it arrives, in order, and added to the total for its series, which the collector keeps in memory: a
    # restart starts every total again, as a restarted service's counters do.
    transform/browser-count-now:
      metric_statements:
        - statements:
            - set(datapoint.start_time, Now())
            - set(datapoint.time, Now())
    # A series a day without a request is forgotten, and starts again from its next one: Prometheus reads nothing into
    # a series' first sample, so the first request of each kind after a restart, or after a quiet day, is not counted.
    delta_to_cumulative:
      max_stale: 25h
  connectors:
    # The app's and the console's requests from browsers, counted by family, operating system and phone or computer,
    # and whether the traffic generator or a visitor sent them: `http_server_browser_requests_total` in Prometheus.
    # Anonymous in aggregate. Not the major version, which would make a series of every release of every browser.
    # Any sender may name itself `website`, so it is a picture of who visits, never evidence (provenance.ts).
    count/browsers:
      spans:
        http.server.browser.requests:
          description: Requests to the app and the console from browsers, by browser family, operating system and device class.
          conditions:
            - span.kind == SPAN_KIND_SERVER and span.attributes["browser.name"] != nil and (resource.attributes["service.name"] == "website" or resource.attributes["service.name"] == "console")
          attributes:
            - key: browser.name
            - key: os.name
            - key: device.type
            - key: traffic
  exporters:
    otlp_http/tempo:
      endpoint: http://tempo:4318
    otlp_http/prometheus:
      endpoint: http://prometheus-server/api/v1/otlp
    otlp_http/loki:
      endpoint: http://loki:3100/otlp
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors:
          - memory_limiter
          - resource/drop-pod-claims
          - attributes/drop-pod-claims
          - k8s_attributes
          - transform/visitors
          - batch
        exporters: [otlp_http/tempo, count/browsers]
      metrics:
        receivers: [otlp]
        processors:
          - memory_limiter
          - resource/drop-pod-claims
          - attributes/drop-pod-claims
          - k8s_attributes
          - k8s_attributes/factory
          - batch
        exporters: [otlp_http/prometheus]
      metrics/browsers:
        receivers: [count/browsers]
        processors: [memory_limiter, transform/browser-count-now, delta_to_cumulative, batch]
        exporters: [otlp_http/prometheus]
      logs:
        receivers: [otlp]
        processors:
          - memory_limiter
          - resource/drop-pod-claims
          - attributes/drop-pod-claims
          - k8s_attributes
          - transform/visitors
          - batch
        exporters: [otlp_http/loki]

# The restricted Pod Security Standard, which the telemetry namespace enforces.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
