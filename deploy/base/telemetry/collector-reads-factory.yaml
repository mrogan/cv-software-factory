# The collector reads the factory's pods, and only those beside the app's, to say which namespace and worker each metric
# came from (k8s_attributes/factory in values/otel-collector.yaml), so the alerts to Martin know the line's own counts.
# A Role in `factory` rather than the chart's ClusterRole, so it cannot list the pods of any other namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-collector-reads-pods
  namespace: factory
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-collector-reads-pods
  namespace: factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-collector-reads-pods
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: telemetry
