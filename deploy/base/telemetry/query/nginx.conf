# The read-only way into the telemetry backends (query.yaml). A port each, as the backend's own: each passes the paths
# the factory reads, by GET, and refuses the rest, so a reader can query and cannot write. Any method but GET or HEAD
# is answered 405, and any other path 403, before it reaches a backend.
#
# Only the matched path is passed on, as nginx has decoded and normalised it, or the trace id it captured, with the
# query string: never the path as the client wrote it, which a backend might read differently. No access log: a query
# can hold what the log watcher asks Loki for, which includes visitors' reports.
daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 256;
}

http {
  access_log off;
  server_tokens off;
  client_max_body_size 1k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  # A large answer streams through memory and is never written to disk, whose emptyDir is small.
  proxy_max_temp_file_size 0;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # A long PromQL or LogQL expression travels in the query string, which the backends took up to their own limits.
  large_client_header_buffers 4 64k;
  default_type text/plain;

  upstream prometheus {
    server prometheus-server.telemetry.svc.cluster.local:80;
  }
  upstream loki {
    server loki.telemetry.svc.cluster.local:3100;
  }
  upstream tempo {
    server tempo.telemetry.svc.cluster.local:3200;
  }

  # The pod's own health, which does not depend on a backend's.
  server {
    listen 8080;
    location = /healthz {
      return 200 "ok\n";
    }
    location / {
      return 404;
    }
  }

  server {
    listen 9090;
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }
    location = /api/v1/query {
      proxy_pass http://prometheus$uri$is_args$args;
    }
    location = /api/v1/query_range {
      proxy_pass http://prometheus$uri$is_args$args;
    }
    location = /-/healthy {
      proxy_pass http://prometheus$uri;
    }
    location = /-/ready {
      proxy_pass http://prometheus$uri;
    }
    location / {
      return 403;
    }
  }

  server {
    listen 3100;
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }
    location = /loki/api/v1/query {
      proxy_pass http://loki$uri$is_args$args;
    }
    location = /loki/api/v1/query_range {
      proxy_pass http://loki$uri$is_args$args;
    }
    location = /ready {
      proxy_pass http://loki$uri;
    }
    location / {
      return 403;
    }
  }

  server {
    listen 3200;
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }
    location = /api/search {
      proxy_pass http://tempo$uri$is_args$args;
    }
    # A TraceQL metrics query at one instant: the log watcher's agreement check counts a window's requests by route.
    location = /api/metrics/query {
      proxy_pass http://tempo$uri$is_args$args;
    }
    # The id alone is passed on, as captured: `$` would also match before a final newline, which `\z` does not.
    location ~ "^/api/traces/([0-9a-fA-F]{1,32})\z" {
      proxy_pass http://tempo/api/traces/$1$is_args$args;
    }
    location = /ready {
      proxy_pass http://tempo$uri;
    }
    location / {
      return 403;
    }
  }
}
