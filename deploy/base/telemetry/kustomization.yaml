# The telemetry stack, as Argo CD Applications of the upstream charts at pinned versions.
# The console and the app send OTLP to the collector, which fans out: traces to Tempo, metrics to Prometheus, logs to Loki.
# The factory's workers read them through a read-only proxy (query.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - otel-collector.yaml
  - collector-reads-website.yaml
  - collector-reads-factory.yaml
  - prometheus.yaml
  - loki.yaml
  - tempo.yaml
  - grafana.yaml
  - query.yaml
  - prometheus-fence.yaml
configMapGenerator:
  # The proxy's configuration. Its name gains a hash of the file, so a change to it rolls the proxy.
  - name: query
    namespace: telemetry
    files:
      - query/nginx.conf
  # Picked up by Grafana's dashboard sidecar, which watches for the grafana_dashboard label. One ConfigMap a dashboard:
  # Argo CD applies each with a copy of it in an annotation, which holds 256 KiB at most, and the dashboards together
  # are near half that.
  - name: dashboard-console
    namespace: telemetry
    files:
      - dashboards/console.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-line
    namespace: telemetry
    files:
      - dashboards/line.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-overview
    namespace: telemetry
    files:
      - dashboards/overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-platform
    namespace: telemetry
    files:
      - dashboards/platform.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: dashboard-website
    namespace: telemetry
    files:
      - dashboards/website.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
