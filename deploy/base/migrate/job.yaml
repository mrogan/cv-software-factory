# Applies whatever migrations the store has not had, then sets the writer's, the console's and the scoreboard's
# passwords from their Secrets. A Sync hook in wave 1: after Postgres (wave 0) is healthy, before the console (wave 2) starts. It runs
# the console's image, which carries the migrations, so a new image brings its migrations with it.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Each profile pins the image by digest, as for the console.
          image: console
          args: [../../packages/store/src/migrate.ts]
          env:
            # As the database's owner: only it may change the schema and the roles.
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: factory
            - name: PGUSER
              value: factory
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-writer
                  key: password
            - name: CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-console
                  key: password
            # The same password as the scoreboard's own Secret, in its namespace (`make up`). Optional, so a cluster
            # made before the scoreboard still migrates; its role then has no password, and cannot log in.
            - name: SCOREBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-scoreboard
                  key: password
                  optional: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
