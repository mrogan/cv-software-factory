# Argo CD, installed once by `make up` with Helm. From then on it deploys everything else from git.

dex:
  enabled: false
notifications:
  enabled: false

configs:
  params:
    # TLS ends at the ingress, and locally there is none.
    server.insecure: true
  cm:
    # Read-only access without logging in, so the local UI opens straight onto the applications.
    users.anonymous.enabled: true
    # Roll each child Application's health up into the root, so `make up` can wait on one thing.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  rbac:
    policy.default: role:readonly

server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.localhost
