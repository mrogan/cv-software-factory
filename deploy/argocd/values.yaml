# Argo CD, installed by `make up` with Helm. From then on it deploys everything else from git, but not itself: a change
# here reaches the cluster at the next `make up`, which upgrades the release in place.

dex:
  enabled: false
notifications:
  enabled: false

configs:
  params:
    # TLS ends at the ingress, and locally there is none.
    server.insecure: true
    # Keep each resource's health in its Application's status, as Argo CD did before 3.0, so `make up` can read it
    # there with kubectl: it waits for everything root deploys but the website (scripts/wait-deployed.sh).
    controller.resource.health.persist: true
  cm:
    # Read-only access without logging in, so the local UI opens straight onto the applications.
    users.anonymous.enabled: true
    # Roll each child Application's health up into the root, so a later sync wave waits for an earlier Application to
    # be healthy: Kyverno before what it guards, Argo Rollouts' CRDs before the app's Rollout. The website's health
    # rolls up too, so root is Suspended through a canary and Degraded after a rollback; the website syncs last
    # (overlays/local/website.yaml), so neither holds anything back.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  rbac:
    policy.default: role:readonly

# Each component's requests and memory limit, from its peak working set on the local cluster in the week to 17 October,
# so a bad sync cannot take the memory the app, telemetry and the factory need on a node they share (the DigitalOcean
# profile's single node). The application controller holds every resource it watches in memory, and peaked at 619Mi.
controller:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  # Go collects hard before the kernel kills: 90% of the limit above, in bytes, as Tempo sets for itself.
  env:
    - name: GOMEMLIMIT
      value: "966367641"
# It renders each Application's manifests with Kustomize, and peaked at 206Mi.
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
# Peaked at 84Mi.
applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
# Peaked at 28Mi.
redis:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# Peaked at 103Mi.
server:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.localhost
