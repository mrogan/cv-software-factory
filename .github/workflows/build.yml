# Builds the console image and the factory's two images on main and pushes them to GHCR, each tagged and labelled
# with the commit it was built from. It opens nothing.
#
# Argo CD deploys only what is in git, so a new image reaches the local cluster through a pull request that pins its
# digest in deploy/overlays/local. The factory's GitHub worker sees the new image in GHCR and opens that pull request
# as the factory's App (ADR 0005): one for the console and one for the factory's images, which are built together.
name: build

on:
  push:
    branches: [main]
    # Only what goes into an image. Merging a deploy pull request must not build again, and nor must a release:
    # it changes only the root package.json's version. The images' dependencies come from the lockfile. The
    # `changes` job below says which images a push changes.
    paths:
      - apps/console/**
      - apps/factory/**
      - apps/runner/**
      - packages/events/**
      - packages/store/**
      - packages/triage/**
      - policy/**
      - docs/design/system/tokens.css
      - docs/design/system/station.ts
      - docs/design/system/mark/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/build.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/console
  FACTORY_IMAGE: ghcr.io/${{ github.repository }}/factory
  BROWSER_IMAGE: ghcr.io/${{ github.repository }}/factory-browser
  RUNNER_IMAGE: ghcr.io/${{ github.repository }}/factory-runner

jobs:
  # Which images to build: each one whose inputs changed since the commit its last deploy pull request pinned. Not
  # since the previous push: the build group keeps one run waiting and cancels it when a newer one queues, and a run
  # can fail, so a change seen only by a run that never finished would never be built. A change built but not yet
  # deployed is built again with the next one, and its deploy pull request moves to the newer digest.
  changes:
    name: which images changed
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      console: ${{ steps.which.outputs.console }}
      factory: ${{ steps.which.outputs.factory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: which
        run: |
          # What each image copies in (the Dockerfiles and their .dockerignore files say the same), and what they share.
          shared='^(packages/events/|packages/store/|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/build\.yml)'
          console="$shared|^(apps/console/|docs/design/system/(tokens\.css|station\.ts|mark/))"
          factory="$shared|^(apps/factory/|apps/runner/|packages/triage/|policy/)"
          # $1: the output, $2: the deploy commits' subject, $3: the image's inputs.
          decide() {
            # The squash-merged deploy pull request's subject names the commit it deployed, such as "run console 1f14f44".
            deployed=$(git log --format=%s -1 --grep "^chore(deploy): $2 [0-9a-f]\{7,40\} " | sed -E "s/^chore\(deploy\): $2 ([0-9a-f]+) .*/\1/")
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$deployed" ] || ! git cat-file -e "$deployed^{commit}" 2>/dev/null; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            elif git diff --name-only "$deployed" "$GITHUB_SHA" | grep -Eq "$3"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          decide console 'run console' "$console"
          decide factory 'run the factory' "$factory"

  image:
    name: build and push
    needs: changes
    if: needs.changes.outputs.console == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Laptops are arm64; cloud nodes are amd64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Software Factory console
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  factory-images:
    name: build and push the factory images
    needs: changes
    if: needs.changes.outputs.factory == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Laptops are arm64; cloud nodes are amd64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: factory
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/factory/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.FACTORY_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Software Factory workers
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=factory
          cache-to: type=gha,mode=max,scope=factory
      - id: browser
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/factory/Dockerfile.browser
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.BROWSER_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Software Factory browser workers
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=factory-browser
          cache-to: type=gha,mode=max,scope=factory-browser
      # The runners' image, built with the factory's so the three always come from one commit.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.RUNNER_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Software Factory runner
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=factory-runner
          cache-to: type=gha,mode=max,scope=factory-runner
