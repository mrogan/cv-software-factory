# The required checks on every pull request.
name: check

on:
  pull_request:
  # Pull requests opened by other workflows don't trigger `pull_request` (GitHub's rule for GITHUB_TOKEN),
  # so build.yml and release.yml dispatch this workflow on their branches instead.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: make check

  image:
    name: image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/console/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
