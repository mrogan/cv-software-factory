# The required checks on every pull request.
name: check

# Pull requests the factory's App opens (deploy, release) run these too, at once: no workflow opens pull requests.
# Theirs are lighter: no browser tests, and a deploy pull request's images are checked rather than built (the `kind`
# job). They also run on main after each merge, which is what the README's badge reports.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this is a release or deploy pull request that the factory's App opened and nobody has changed. Only those
  # skip checks, and a skipped job counts as passed for the ruleset, so the test is the author and the exact files and
  # lines that change. Anything else, or this job failing, is `code` and runs everything.
  kind:
    name: which checks apply
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      kind: ${{ steps.which.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The merge commit and its parents: the first is the base, so the diff between them is what would merge.
          fetch-depth: 2
      - id: which
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          kind=code
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$AUTHOR" = 'mrogan-software-factory[bot]' ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
            # Every changed line of package.json is its version.
            other_lines=$(git diff --unified=0 HEAD^1 HEAD -- package.json | grep -E '^[-+]' | grep -vE '^(\+\+\+|---) ' | grep -vE '^[-+]  "version": "[^"]+",$' || true)
            if [ -n "$files" ] && ! grep -vqxE 'CHANGELOG\.md|package\.json|\.release-please-manifest\.json' <<< "$files" && [ -z "$other_lines" ]; then
              kind=release
            elif [ -n "$files" ] && ! grep -vqxE 'deploy/overlays/local/(console|factory)-image/kustomization\.yaml' <<< "$files"; then
              kind=deploy
            fi
          fi
          echo "$kind"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

  check:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The store's tests run against a real Postgres: the image the cluster runs. Docker's official images come from
    # Amazon's copy, by the same digests: hosted runners share addresses, and Docker Hub limits pulls by address.
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U factory" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://factory:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: node pnpm kustomize
      - run: pnpm install --frozen-lockfile
      - run: make check

  # The browser tests are two jobs, side by side: the console's, and the factory's senses (the crawler and the probes).
  # Each needs the pinned Playwright image, on arm64 like the laptops the snapshots are made on, so they match.
  console-browser:
    name: console browser tests
    needs: kind
    # Skipped only for a release or deploy pull request: they change nothing a browser test could see.
    if: ${{ !cancelled() && needs.kind.outputs.kind != 'release' && needs.kind.outputs.kind != 'deploy' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: test
        options: --health-cmd "pg_isready -U factory" --health-interval 2s --health-retries 30
    env:
      SF_PINNED_BROWSER: '1'
      TEST_DATABASE_URL: postgres://factory:test@postgres:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @software-factory/console build
      - run: pnpm exec playwright test
        working-directory: apps/console
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-report
          path: |
            apps/console/e2e-report
            apps/console/e2e-results
          retention-days: 7

  senses-browser:
    name: senses browser tests
    needs: kind
    if: ${{ !cancelled() && needs.kind.outputs.kind != 'release' && needs.kind.outputs.kind != 'deploy' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec vitest run --project browser

  # The one check the ruleset requires of the browser tests (scripts/github-settings.ts), so that it need not change
  # when they are split differently. It passes when both passed, and is skipped, as they are, for a release or deploy
  # pull request.
  browser:
    name: browser tests
    needs: [kind, console-browser, senses-browser]
    if: ${{ !cancelled() && needs.kind.outputs.kind != 'release' && needs.kind.outputs.kind != 'deploy' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - env:
          CONSOLE: ${{ needs.console-browser.result }}
          SENSES: ${{ needs.senses-browser.result }}
        run: |
          echo "console: $CONSOLE, senses: $SENSES"
          [ "$CONSOLE" = success ] && [ "$SENSES" = success ]

  # A deploy pull request builds nothing: it checks that each image it pins was built from main. Any change that moves a
  # pin checks that the images it moves to were signed there. A release pull request changes nothing an image holds, so
  # it skips this.
  image:
    name: image builds
    needs: kind
    if: ${{ !cancelled() && needs.kind.outputs.kind != 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOY: ${{ needs.kind.outputs.kind == 'deploy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit and its parent (a pull request's base), so the signature check can tell which pins it moves.
          fetch-depth: 2
      # build.yml pushes each image tagged and labelled with the commit it was built from, and only on main does it
      # run with the right to push. A digest from a run on another branch, or one that is not in GHCR, fails here.
      - name: Check the pinned images were built from main
        if: env.DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in deploy/overlays/local/*-image/kustomization.yaml; do
            for ref in $(yq '.images[] | .newName + "@" + .digest' "$file"); do
              case "$ref" in
                "ghcr.io/$GITHUB_REPOSITORY/"*@sha256:*) ;;
                *) echo "::error file=$file::$ref is not one of this repository's images, pinned by digest"; exit 1 ;;
              esac
              revisions=$(docker buildx imagetools inspect "$ref" --format '{{ json .Image }}' \
                | jq -r '[.. | objects | .config?.Labels?["org.opencontainers.image.revision"]? // empty] | unique | .[]')
              if [ "$(wc -w <<< "$revisions")" -ne 1 ]; then
                echo "::error file=$file::$ref does not name the one commit it was built from (found: ${revisions:-none})"; exit 1
              fi
              # "ahead" or "identical": main contains the commit.
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$revisions...main" --jq .status)
              if [ "$status" != ahead ] && [ "$status" != identical ]; then
                echo "::error file=$file::$ref was built from $revisions, which is not on main"; exit 1
              fi
              echo "$ref: built from $revisions, on main"
            done
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      # Each image carries the signature of build.yml on this repository's main, made with the workflow's own identity,
      # and an SBOM it attested. Every change to a pin file, the App's or anyone's, and only the pins it moves: one
      # made before images were signed stays as it is until its own deploy moves it. HEAD^1 is the base a pull request
      # merges into, or main before the commit pushed to it.
      - name: Check the images it moves to were signed by build.yml on main
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/build.yml@refs/heads/main"
          trust=(--certificate-identity "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com)
          # A pin is the image an entry names, so two entries that swap digests both move.
          pins='.images[] | .name + "=" + .newName + "@" + .digest'
          # Each read is its own assignment, so one that fails fails the step rather than checking nothing.
          files=$(git diff --name-only HEAD^1 HEAD -- 'deploy/overlays/local/*-image/kustomization.yaml')
          for file in $files; do
            refs=$(yq "$pins" "$file")
            [ -n "$refs" ] || { echo "::error file=$file::$file pins no image"; exit 1; }
            # A pin file new in this change moves every pin in it.
            before=""
            if git cat-file -e "HEAD^1:$file" 2> /dev/null; then
              base=$(git show "HEAD^1:$file")
              before=$(yq "$pins" <<< "$base")
            fi
            moved=$(comm -13 <(sort -u <<< "$before") <(sort -u <<< "$refs"))
            [ -n "$moved" ] || echo "$file: moves no pin, nothing to check"
            for pin in $moved; do
              ref=${pin#*=}
              if ! cosign verify "${trust[@]}" "$ref" > /dev/null; then
                echo "::error file=$file::$ref is not signed by $identity"; exit 1
              fi
              if ! cosign verify-attestation --type spdxjson "${trust[@]}" "$ref" > /dev/null; then
                echo "::error file=$file::$ref has no SBOM attested by $identity"; exit 1
              fi
              echo "$ref: signed by $identity, with its SBOM attested"
            done
          done
      - if: env.DEPLOY != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.DEPLOY != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/console/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: env.DEPLOY != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/factory/Dockerfile
          push: false
          cache-from: type=gha,scope=factory
          cache-to: type=gha,mode=max,scope=factory
      - if: env.DEPLOY != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/factory/Dockerfile.browser
          push: false
          cache-from: type=gha,scope=factory-browser
          cache-to: type=gha,mode=max,scope=factory-browser
      - if: env.DEPLOY != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/runner/Dockerfile
          push: false
          cache-from: type=gha,scope=factory-runner
          cache-to: type=gha,mode=max,scope=factory-runner
