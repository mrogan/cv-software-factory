# The required checks on every pull request.
name: check

# Pull requests that workflows open (deploy, release) run these too, once Martin approves the runs on the pull request.
# They also run on main after each merge, which is what the README's badge reports.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The store's tests run against a real Postgres: the image the cluster runs.
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U factory" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://factory:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: node pnpm kustomize
      - run: pnpm install --frozen-lockfile
      - run: make check

  browser:
    name: browser tests
    # The pinned Playwright image, on arm64 like the laptops the snapshots are made on, so they match.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    services:
      postgres:
        image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: test
        options: --health-cmd "pg_isready -U factory" --health-interval 2s --health-retries 30
    env:
      SF_PINNED_BROWSER: '1'
      TEST_DATABASE_URL: postgres://factory:test@postgres:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @software-factory/console build
      - run: pnpm exec playwright test
        working-directory: apps/console
      - run: pnpm exec vitest run --project browser
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-report
          path: |
            apps/console/e2e-report
            apps/console/e2e-results
          retention-days: 7

  image:
    name: image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/console/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/factory/Dockerfile
          push: false
          cache-from: type=gha,scope=factory
          cache-to: type=gha,mode=max,scope=factory
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/factory/Dockerfile.browser
          push: false
          cache-from: type=gha,scope=factory-browser
          cache-to: type=gha,mode=max,scope=factory-browser
