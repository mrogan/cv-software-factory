# Keeps a release pull request open with the next version and its changelog, from the Conventional Commits on main.
# Merging it tags the release.
name: release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # tag releases, update the release branch
      pull-requests: write # open and update the release pull request
      issues: write # label it
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
