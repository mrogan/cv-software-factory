# Signs two images of ours, keyless, as itself: this workflow on the branch refusal/other-identity, and not build.yml
# on main, which is the only identity the cluster's image policy trusts (ADR 0010). scripts/admission-refusals.sh asks
# the cluster to run them, and keeps the refusal of each for its signature. The images are the arm64 manifests inside
# the factory's and its browser's build of 22bcfa0, which build.yml did not sign (it signs each multi-platform index).
#
# It lives on that branch alone, which is kept and never merged, so its identity is never build.yml's on main, and it
# runs once, on the push that makes the branch.
name: other-identity

on:
  push:
    branches: [refusal/other-identity]

permissions: {}

jobs:
  sign:
    name: sign as another identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      packages: write # cosign keeps the signatures beside the images
      id-token: write # this workflow's identity, which Fulcio certifies
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: |
          set -euo pipefail
          for ref in \
            ghcr.io/the-roganator/cv-software-factory/factory@sha256:abbfbe0ced09e4f8913dcecba14703bf80a1bdea16d208eaa090c5d863b807d6 \
            ghcr.io/the-roganator/cv-software-factory/factory-browser@sha256:ba64363b2157a0acd8409c71ccb17d2d76288939a804e175cdc4fe858564568a
          do
            cosign sign --yes "$ref"
          done
