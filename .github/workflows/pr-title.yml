# Pull requests are squash-merged, so the title becomes the commit on main: it must be a Conventional Commit.
#
# Shared: cv-worlds-worst-website calls this workflow at a pinned commit, so both repositories keep one rule,
# and the rule stays out of reach of anything that can write to the app's repository.
name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_call:

permissions:
  contents: read

jobs:
  title:
    name: pull request title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow's own repository and commit, which is not the caller's when it is called from elsewhere.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            mise.toml
            scripts/commit-msg.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: node
      # Dependabot writes its own titles, and a long image tag takes them past the length (commit-msg.ts); the rest of
      # the rule still holds for them. It goes by who opened the pull request, so a title edited by hand on one of
      # Dependabot's is let run long too.
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          ANY_LENGTH: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && '--any-length' || '' }}
        run: node scripts/commit-msg.ts --title "$TITLE" $ANY_LENGTH
