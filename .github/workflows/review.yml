# The review gate (ADR 0014): posts the `review` check, as the review App, on a pull request's head and on the merge
# queue's commit for it. It passes when Martin opened the pull request, or approved its head after the last push
# (scripts/review-gate.ts). The ruleset requires the check from the review App alone, so no workflow, this one's own
# job included, can stand in for it.
#
# Only main's copy runs with the App's key. `pull_request_target` and `workflow_run` run the workflow as main has it,
# and the key is in the `review` environment, which only main may use: a pull request into another branch runs that
# branch's copy, which the environment refuses. It reads the pull request's metadata through the API and never checks
# out, builds or runs its code. A review, and the merge queue, run review-requested.yml, which holds nothing; its run
# starts this one, here, from main.
#
# The review App is the-roganator's, App ID 5470762, installed on every repository there. Until its key is in the
# `review` environment, as the secret REVIEW_APP_PRIVATE_KEY, the gate says its verdict and posts nothing.
#
# Shared: cv-worlds-worst-website calls this workflow at a pinned commit from its own, with the same triggers and a
# `review` environment of its own, so both repositories keep one rule. Its caller passes REVIEW_APP_PRIVATE_KEY by name,
# or with `secrets: inherit`: GitHub's docs say a called job with `environment:` uses the caller's environment of that
# name, but resolves a secret to empty unless the caller passes it, and a secret held only in the environment may be
# passed by name. Unpassed, the gate says its verdict and posts nothing, as before the key exists.
#
# Two runs GitHub holds for a maintainer's approval, before it reads any job, so no condition here can stop them:
#
# - A review by Copilot, which GitHub treats as an outside contributor: its run of review-requested.yml is held, and
#   when its pull request closes, the run that one starts here. Only Martin's reviews count, so neither has anything to
#   judge: approved, the first only asks the gate to look again, and the second finds the pull request closed. Both are
#   safe to leave, and nothing waits on them.
# - A review of a pull request from a first-time contributor's fork: its run of review-requested.yml is held, so
#   Martin's approval reaches the gate only once he approves that run, or re-runs this workflow's last run for the pull
#   request, which reads his reviews afresh.
name: review

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_run:
    workflows: [review requested]
    types: [completed]
  workflow_call:
    secrets:
      REVIEW_APP_PRIVATE_KEY:
        description: The review App's key, from the caller's `review` environment.
        required: false

permissions: {}

# One verdict at a time for a branch, each read afresh, so an older one is never posted after a newer one. By the
# branch, which every run names, a fork's included; the merge queue's runs each have a branch of their own. A deleted
# fork names no repository: its pull request's runs go by its number, and a review's run, which then finds no pull
# request to judge, by its own id, so none shares a group with another branch's.
concurrency:
  group: >-
    review-${{ github.event.pull_request.head.repo.full_name || github.event.workflow_run.head_repository.full_name ||
    format('gone-{0}', github.event.pull_request.number || github.run_id) }}:${{
    github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}

jobs:
  review:
    name: review gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: review
    permissions:
      contents: read
      pull-requests: read
    env:
      # Whether the App's key is here, from the environment or a caller: a step's condition cannot read a secret, only
      # this.
      HAS_KEY: ${{ secrets.REVIEW_APP_PRIVATE_KEY != '' }}
    steps:
      # This workflow's own repository and commit, main's, which is not the caller's when it is called from elsewhere.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: |
            mise.toml
            scripts/review-gate.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: node
      # A token for checks alone: with it, the gate can post a check run and do nothing else.
      - id: app
        if: env.HAS_KEY == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The review App's Client ID, which is not a secret.
          client-id: Iv23liFNqAvApddT27zU
          private-key: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write
      - name: Judge the pull request, and post the check
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/review-gate.ts
