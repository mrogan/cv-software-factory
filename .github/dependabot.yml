# Weekly dependency updates, each as a pull request through the same checks as any other change.
# The cooldown waits a few days after a release before proposing it: most malicious releases are pulled within hours.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node's own types follow the Node version in mise.toml, which moves by hand.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # 2.1.15 was published without provenance (2.1.14 and 2.1.16 have it), so pnpm's trust policy refuses it and
      # fails the whole update. Remove once lefthook 2.1.16 or later is merged.
      - dependency-name: lefthook
        versions: ['2.1.15']
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # The library's packages move in one pull request, ahead of the tooling group, which would otherwise take
      # @playwright/test alone. Its browsers' image is pinned outside npm, so that pull request fails
      # scripts/image-pins.test.ts until the image is moved by hand to the same release.
      playwright:
        patterns: ['playwright', 'playwright-core', '@playwright/test']
      opentelemetry:
        patterns: ['@opentelemetry/*']
      fonts:
        patterns: ['@fontsource/*', '@fontsource-variable/*']
      tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # CI pulls these images from its own copy in GHCR (scripts/ci-images.sh), but every pin names its upstream, which is
  # what Dependabot reads. Docker's official images are named on Docker Hub, as `node` and `postgres`: Amazon's copy
  # of it (public.ecr.aws) refuses Dependabot partway through listing Node's thousands of tags. Postgres has one pin, its StatefulSet's, which
  # everything else that runs it reads.
  - package-ecosystem: docker
    directories:
      - /apps/console
      - /apps/factory
      - /apps/runner
      - /.devcontainer
      - /deploy/base/postgres
    schedule:
      interval: weekly
    ignore:
      # The build image's Node matches mise.toml's; a new major is a deliberate change, not a weekly bump.
      - dependency-name: node
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Node is pinned in three Dockerfiles, so one pull request moves it in all of them: scripts/image-pins.test.ts
      # fails when they disagree. A new major is ignored above.
      node:
        patterns: [node]
        group-by: dependency-name

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
