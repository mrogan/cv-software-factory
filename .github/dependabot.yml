# Weekly dependency updates, each as a pull request through the same checks as any other change.
# The cooldown waits a few days after a release before proposing it: most malicious releases are pulled within hours.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node's own types follow the Node version in mise.toml, which moves by hand.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # Published by hand without provenance, between two releases with it. pnpm's trust policy refuses it, and with
      # it the whole npm update, so it is skipped rather than allowed: 2.1.16 has provenance again.
      - dependency-name: lefthook
        versions: ['2.1.15']
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      opentelemetry:
        patterns: ['@opentelemetry/*']
      fonts:
        patterns: ['@fontsource/*', '@fontsource-variable/*']
      tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories:
      - /apps/console
      - /.devcontainer
      - /deploy/base/postgres
    schedule:
      interval: weekly
    ignore:
      # The build image's Node matches mise.toml's; a new major is a deliberate change, not a weekly bump.
      - dependency-name: node
        update-types: [version-update:semver-major]
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
